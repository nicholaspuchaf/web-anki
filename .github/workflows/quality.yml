name: Quality and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      # These scripts use only Bun/Node built-ins. Scan before installing dependencies.
      - name: Install checksum-verified Trivy
        run: bun run security:setup
      - name: Scan known malicious packages, vulnerabilities and secrets
        run: bun run security

  quality:
    name: Lint, types, tests and builds
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install browser
        run: bunx --no-install playwright install --with-deps chromium
      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Run complete quality gate
        run: bun run check:all
