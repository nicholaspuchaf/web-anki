<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 790" role="img" aria-label="Da entrada à imagem"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6680"/></marker></defs><rect width="580" height="790" rx="20" fill="#f1f5fb"/><text x="290" y="42" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#172d45">Da entrada à imagem</text><rect x="30" y="70" width="520" height="82" rx="12" fill="#deebff" stroke="#69809a"/><text x="290" y="102" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172d45">1 · Enviar a entrada</text><text x="290" y="130" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#28445f">Cliente → rede → datacenter</text><path d="M290 153V178" stroke="#4d6680" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="185" width="520" height="82" rx="12" fill="#dcf0e8" stroke="#69809a"/><text x="290" y="217" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172d45">2 · Processar e renderizar</text><text x="290" y="245" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#28445f">Servidor executa a aplicação</text><path d="M290 268V293" stroke="#4d6680" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="300" width="520" height="82" rx="12" fill="#eee3fa" stroke="#69809a"/><text x="290" y="332" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172d45">3 · Codificar</text><text x="290" y="360" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#28445f">Quadro → vídeo comprimido</text><path d="M290 383V408" stroke="#4d6680" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="415" width="520" height="82" rx="12" fill="#deebff" stroke="#69809a"/><text x="290" y="447" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172d45">4 · Entregar pela rede</text><text x="290" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#28445f">Datacenter → dispositivo</text><path d="M290 498V523" stroke="#4d6680" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="530" width="520" height="82" rx="12" fill="#dcf0e8" stroke="#69809a"/><text x="290" y="562" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172d45">5 · Decodificar</text><text x="290" y="590" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#28445f">Cliente reconstrói os quadros</text><path d="M290 613V638" stroke="#4d6680" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="645" width="520" height="82" rx="12" fill="#eee3fa" stroke="#69809a"/><text x="290" y="677" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172d45">6 · Exibir</text><text x="290" y="705" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#28445f">Tela apresenta o resultado</text></svg>
